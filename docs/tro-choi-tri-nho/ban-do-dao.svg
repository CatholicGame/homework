<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <!-- Minh hoạ: màn bản đồ Đảo Trí Nhớ (màn ngang). Không phải hình thật của app. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BAE6FD"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
    <filter id="halo"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#3F3A40" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1000" cy="120" r="56" fill="#FDE047" stroke="#3F3A40" stroke-width="4"/>
  <g fill="#fff" stroke="#3F3A40" stroke-width="3"><ellipse cx="300" cy="120" rx="80" ry="30"/><ellipse cx="360" cy="100" rx="50" ry="30"/><ellipse cx="760" cy="90" rx="70" ry="26"/></g>
  <rect y="230" width="1600" height="670" fill="url(#sea)"/>
  <g stroke="#E0F2FE" stroke-width="4" fill="none" stroke-linecap="round"><path d="M80 300q20-12 40 0t40 0"/><path d="M1380 330q20-12 40 0t40 0"/><path d="M200 820q20-12 40 0t40 0"/><path d="M1300 800q20-12 40 0t40 0"/></g>
  <!-- đảo -->
  <path d="M230 600 C 220 380, 520 290, 800 300 C 1100 290, 1390 380, 1370 600 C 1360 760, 1060 820, 800 815 C 520 820, 240 770, 230 600 Z" fill="#FDE68A" stroke="#3F3A40" stroke-width="4"/>
  <path d="M330 590 C 330 430, 560 370, 800 375 C 1050 370, 1270 440, 1270 590 C 1260 700, 1050 740, 800 740 C 560 742, 340 700, 330 590 Z" fill="#86EFAC" stroke="#3F3A40" stroke-width="3"/>

  <!-- 5 trạm: mỗi trạm là một nút to (bảng gỗ) -->
  <g font-weight="800" text-anchor="middle">
    <g filter="url(#halo)">
      <rect x="300" y="330" width="320" height="200" rx="26" fill="#fff" stroke="#3F3A40" stroke-width="4"/>
      <rect x="640" y="330" width="320" height="200" rx="26" fill="#fff" stroke="#3F3A40" stroke-width="4"/>
      <rect x="980" y="330" width="320" height="200" rx="26" fill="#fff" stroke="#3F3A40" stroke-width="4"/>
      <rect x="470" y="555" width="320" height="200" rx="26" fill="#fff" stroke="#3F3A40" stroke-width="4"/>
      <rect x="810" y="555" width="320" height="200" rx="26" fill="#fff" stroke="#3F3A40" stroke-width="4"/>
    </g>
    <!-- 1 Bãi lật thẻ -->
    <g transform="translate(460 440) scale(1.3)"><g transform="translate(-58 -55)"><rect width="48" height="62" rx="8" fill="#60A5FA" stroke="#3F3A40" stroke-width="3" transform="rotate(-10 24 31)"/><rect x="58" width="48" height="62" rx="8" fill="#fff" stroke="#3F3A40" stroke-width="3" transform="rotate(8 82 31)"/><text x="82" y="42" font-size="26" fill="#F59E0B">42</text></g><text y="48" font-size="26" fill="#3F3A40">Bãi Lật Thẻ</text></g>
    <!-- 2 Khỉ giấu thẻ -->
    <g transform="translate(800 440) scale(1.3)"><circle cx="0" cy="-30" r="30" fill="#A16207" stroke="#3F3A40" stroke-width="3"/><ellipse cx="0" cy="-22" rx="20" ry="16" fill="#FDE68A"/><circle cx="-9" cy="-34" r="4" fill="#3F3A40"/><circle cx="9" cy="-34" r="4" fill="#3F3A40"/><text y="48" font-size="26" fill="#3F3A40">Khỉ Giấu Thẻ</text></g>
    <!-- 3 Hang đom đóm -->
    <g transform="translate(1140 440) scale(1.3)"><path d="M-45 0 q0-70 45-70 q45 0 45 70z" fill="#475569" stroke="#3F3A40" stroke-width="3"/><circle cx="-14" cy="-30" r="6" fill="#FDE047"/><circle cx="12" cy="-44" r="5" fill="#FDE047"/><circle cx="20" cy="-18" r="4" fill="#FDE047"/><text y="48" font-size="26" fill="#3F3A40">Hang Đom Đóm</text></g>
    <!-- 4 Đàn đá -->
    <g transform="translate(630 665) scale(1.3)"><g stroke="#3F3A40" stroke-width="3"><rect x="-60" y="-50" width="24" height="44" rx="6" fill="#F472B6"/><rect x="-32" y="-58" width="24" height="52" rx="6" fill="#FB923C"/><rect x="-4" y="-64" width="24" height="58" rx="6" fill="#FDE047"/><rect x="24" y="-70" width="24" height="64" rx="6" fill="#4ADE80"/></g><text y="48" font-size="26" fill="#3F3A40">Đàn Đá</text></g>
    <!-- 5 Rùa nhớ đường -->
    <g transform="translate(970 665) scale(1.3)"><ellipse cx="0" cy="-26" rx="44" ry="28" fill="#4ADE80" stroke="#3F3A40" stroke-width="3"/><circle cx="50" cy="-30" r="14" fill="#86EFAC" stroke="#3F3A40" stroke-width="3"/><path d="M-20-40 l12 14 l16-14 l12 14" stroke="#166534" stroke-width="3" fill="none"/><text y="48" font-size="26" fill="#3F3A40">Rùa Nhớ Đường</text></g>
  </g>
  <!-- thanh trên: quay lại, tên, rương -->
  <g font-weight="800">
    <rect x="30" y="26" width="96" height="76" rx="18" fill="#fff" stroke="#3F3A40" stroke-width="4"/><text x="78" y="78" font-size="40" text-anchor="middle" fill="#3F3A40">‹</text>
    <rect x="150" y="26" width="420" height="76" rx="18" fill="#fff" stroke="#3F3A40" stroke-width="4"/><text x="360" y="77" font-size="36" text-anchor="middle" fill="#3F3A40">Đảo Trí Nhớ · Lớp 3</text>
    <g filter="url(#halo)"><rect x="1150" y="26" width="420" height="96" rx="20" fill="#FEF3C7" stroke="#3F3A40" stroke-width="4"/></g>
    <g transform="translate(1200 74)"><rect x="-30" y="-14" width="60" height="38" rx="6" fill="#B45309" stroke="#3F3A40" stroke-width="3"/><path d="M-30-14 q30-30 60 0z" fill="#D97706" stroke="#3F3A40" stroke-width="3"/><rect x="-6" y="-4" width="12" height="14" fill="#FDE047" stroke="#3F3A40" stroke-width="2"/></g>
    <text x="1250" y="66" font-size="26" fill="#3F3A40">Rương kho báu</text>
    <text x="1250" y="102" font-size="24" fill="#B45309">💎 37 · 🔔 8 thẻ chờ ôn</text>
  </g>
  <!-- nút chính: chuyến đi hôm nay -->
  <g font-weight="900" text-anchor="middle">
    <rect x="560" y="820" width="480" height="66" rx="33" fill="#C2410C"/>
    <rect x="560" y="812" width="480" height="66" rx="33" fill="#FB923C" stroke="#3F3A40" stroke-width="4"/>
    <text x="800" y="857" font-size="32" fill="#fff">⛵ Chuyến đi hôm nay</text>
  </g>
  <!-- thuyền -->
  <g transform="translate(1420 740)" stroke="#3F3A40" stroke-width="3"><path d="M-70 0 h140 l-24 34 h-92z" fill="#F87171"/><path d="M0 0 v-110" stroke-width="5"/><path d="M4-104 l60 80 h-60z" fill="#fff"/></g>
</svg>
