<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>g3games dev</title>
<link rel="stylesheet" href="/src/styles/global.css" /><link rel="stylesheet" href="/src/styles/game.css" /></head>
<body><div id="app"></div>
<script type="module">
// Trang dev: mở sách lớp 3 không cần đăng nhập, bấm "🎮 Trò chơi tăng cường" để chơi. ?book=practice cho sách Luyện tập.
const book = new URLSearchParams(location.search).get('book') === 'practice' ? 'grade3Practice' : 'grade3Workbook';
const { render } = await import(/* @vite-ignore */ `/src/games/${book}.js`);
render(document.getElementById('app'), () => location.reload());
</script></body></html>
