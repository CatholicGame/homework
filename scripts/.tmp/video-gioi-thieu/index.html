<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giới thiệu Toán Tiểu Học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Nunito', 'Segoe UI', sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  /* khung dọc 9:16 vừa màn hình; mọi cỡ theo bề rộng khung (cqw) */
  #frame { position: relative; height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; overflow: hidden; container-type: inline-size; background: #FFF6E9; }
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(6cqw); opacity: 0.55; animation: vg-drift 18s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { width: 70cqw; height: 70cqw; left: -20cqw; top: -10cqw; background: #FDE68A; }
  .bg i:nth-child(2) { width: 80cqw; height: 80cqw; right: -30cqw; top: 40%; background: #BAE6FD; animation-duration: 23s; }
  .bg i:nth-child(3) { width: 60cqw; height: 60cqw; left: 10cqw; bottom: -20cqw; background: #FBCFE8; animation-duration: 27s; }
  .bg i:nth-child(4) { width: 50cqw; height: 50cqw; right: -10cqw; top: -8cqw; background: #BBF7D0; animation-duration: 21s; }
  @keyframes vg-drift { to { transform: translate(8cqw, 6cqw) scale(1.15); } }
  /* số và dấu phép tính trôi nhẹ thay cho ngôi sao */
  .bg b { position: absolute; font-weight: 900; font-size: 6cqw; opacity: 0.22; animation: vg-twinkle 4.2s ease-in-out infinite; }
  @keyframes vg-twinkle { 50% { opacity: 0.5; transform: translateY(-1.5cqw) rotate(12deg); } }

  /* dấu logo suốt video, góc trên trái (tránh cột nút TikTok bên phải và chân) */
  #mark { position: absolute; left: 4.5cqw; top: 4.4%; z-index: 20; display: flex; align-items: center; gap: 2cqw;
    padding: 1.3cqw 3.6cqw 1.3cqw 1.3cqw; border-radius: 999px; background: rgba(255,255,255,0.92);
    box-shadow: 0 0.8cqw 3cqw rgba(120,72,20,0.2); transition: opacity 1s ease; }
  #mark img { width: 9cqw; height: 9cqw; border-radius: 2.4cqw; display: block; }
  #mark span { font-weight: 900; font-size: 4.3cqw; color: #BE185D; }
  #mark small { display: block; font-weight: 700; font-size: 2.6cqw; color: #B45309; margin-top: -0.4cqw; }
  #frame.is-end #mark { opacity: 0; }

  .seg { position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s ease; z-index: 1; }
  .seg.on { opacity: 1; z-index: 2; }
  .seg.prev { opacity: 1; z-index: 1; }
  .head { position: absolute; left: 6cqw; right: 6cqw; top: 11.4%; text-align: left; }
  .head div { font-weight: 900; line-height: 1.08; color: #1E1B4B; font-size: 7.6cqw; letter-spacing: -0.01em;
    opacity: 0; transform: translateY(3cqw) scale(0.96); transition: opacity 0.5s ease, transform 0.6s cubic-bezier(.3,1.6,.5,1); }
  .head div + div { color: #DB2777; }
  .seg.on .head div { opacity: 1; transform: none; }
  .seg.on .head div + div { transition-delay: 0.25s; }

  /* phụ đề: trên dải chú thích của TikTok (chừa 21% đáy) */
  #cap { position: absolute; left: 5cqw; right: 5cqw; top: 72.6%; z-index: 15; display: flex; justify-content: center; pointer-events: none; }
  #cap p { margin: 0; padding: 2.2cqw 4cqw; border-radius: 3.4cqw; background: rgba(30,27,75,0.86); color: #FFF;
    font-family: 'Be Vietnam Pro', sans-serif; font-weight: 500; font-size: 4.5cqw; line-height: 1.38; text-align: center; text-wrap: balance;
    box-shadow: 0 1cqw 4cqw rgba(30,27,75,0.25); opacity: 0; transform: translateY(1.5cqw); transition: opacity 0.4s ease, transform 0.4s ease; }
  #cap p.on { opacity: 1; transform: none; }

  .it { position: absolute; transform: translateX(-50%) rotate(var(--rot, 0deg)); z-index: var(--z, 0); }
  .it > .in { opacity: 0; transform: translateY(6cqw) scale(0.94); transition: opacity 0.6s ease var(--d, 0s), transform 0.8s cubic-bezier(.3,1.4,.5,1) var(--d, 0s); }
  .seg.on .it > .in, .seg.prev .it > .in { opacity: 1; transform: none; }

  /* điện thoại */
  .phone { position: relative; aspect-ratio: 9 / 19.5; border-radius: 6.5cqw; background: #111827; padding: 1.5cqw;
    box-shadow: 0 3cqw 7cqw rgba(30,27,75,0.35), inset 0 0 0 0.4cqw #374151; }
  .phone .scr { position: relative; width: 100%; height: 100%; border-radius: 5.2cqw; overflow: hidden; background: #FFF8EE; }
  .phone .notch { position: absolute; top: 2.4cqw; left: 50%; width: 24%; height: 2.6cqw; margin-left: -12%; border-radius: 9cqw; background: #111827; z-index: 9; }
  /* điện thoại chiếu đoạn quay: khung thấp hơn cho vừa video 9:15 */
  .phone.vid { aspect-ratio: 9 / 16.6; }
  .phone.vid .notch { top: 1.6cqw; height: 2cqw; }
  .phone video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .scr img.long { position: absolute; left: 0; top: 0; width: 100%; transition: transform var(--scroll-t, 10s) cubic-bezier(.45,0,.35,1) 1.2s; }
  .tap { position: absolute; width: 14cqw; height: 14cqw; margin: -7cqw 0 0 -7cqw; border-radius: 50%; border: 0.8cqw solid rgba(219,39,119,0.9);
    background: rgba(249,168,212,0.35); opacity: 0; z-index: 8; }
  .seg.on .tap { animation: vg-tap 1.2s ease-out var(--tap-d, 3s) 2 both; }
  @keyframes vg-tap { 0% { opacity: 0; transform: scale(0.3); } 30% { opacity: 1; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.3); } }

  /* dải thẻ các lớp */
  .grades { display: flex; flex-wrap: wrap; justify-content: center; gap: 2cqw 2cqw; }
  .grades i { font-style: normal; font-weight: 900; font-size: 4.6cqw; color: #FFF; padding: 1.4cqw 3.6cqw; border-radius: 99px;
    border: 0.7cqw solid #FFF; box-shadow: 0 1.2cqw 3cqw rgba(30,27,75,0.25);
    opacity: 0; transform: translateY(4cqw) scale(0.6); transition: opacity 0.4s ease, transform 0.6s cubic-bezier(.3,1.8,.5,1); }
  .seg.on .grades i { opacity: 1; transform: none; }

  /* màn mời: biểu tượng app trên màn hình chính */
  .cta { position: relative; height: 88cqw; }
  .cta .hs { position: absolute; left: 50%; top: 0; width: 30cqw; height: 60cqw; aspect-ratio: auto; margin-left: -16cqw; }
  .cta .hs .scr { background: linear-gradient(160deg, #38BDF8, #DB2777 60%, #F59E0B); }
  .cta .grid { position: absolute; inset: 9cqw 3cqw auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3.4cqw 2cqw; }
  .cta .grid i { aspect-ratio: 1; border-radius: 2.4cqw; background: rgba(255,255,255,0.28); }
  .cta .app { position: absolute; left: 50%; top: 46%; transform: translateX(-50%); text-align: center; color: #FFF; font: 800 2.6cqw 'Nunito'; white-space: nowrap; }
  .cta .app img { width: 12cqw; height: 12cqw; border-radius: 3.6cqw; display: block; margin: 0 auto 1cqw; box-shadow: 0 1cqw 3cqw rgba(0,0,0,0.35); }
  .seg.on .cta .app img { animation: vg-pop 0.9s cubic-bezier(.3,1.8,.5,1) 1.4s both, vg-bob 2.4s ease-in-out 2.6s infinite; }
  @keyframes vg-pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes vg-bob { 50% { transform: translateY(-1cqw) scale(1.05); } }
  .cta .pill { position: absolute; left: 50%; top: 63cqw; transform: translateX(-50%); white-space: nowrap; padding: 2.6cqw 6cqw; border-radius: 99px;
    background: #DB2777; color: #FFF; font-weight: 900; font-size: 6.6cqw; box-shadow: 0 1.6cqw 0 #9D174D, 0 3cqw 6cqw rgba(219,39,119,0.4); }
  .seg.on .cta .pill { animation: vg-pulse 1.6s ease-in-out 1s infinite; }
  @keyframes vg-pulse { 50% { transform: translateX(-50%) scale(1.05); } }

  /* màn kết */
  #end { position: absolute; inset: 0; z-index: 18; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6cqw;
    padding-bottom: 18%; background: radial-gradient(ellipse at 50% 40%, #FFF8EE, #FCE7F3); opacity: 0; transition: opacity 1s ease; text-align: center; }
  #frame.is-end #end { opacity: 1; }
  #end img { width: 34cqw; height: 34cqw; border-radius: 8cqw; box-shadow: 0 3cqw 7cqw rgba(120,72,20,0.35); }
  #end b { font-weight: 900; font-size: 9cqw; color: #BE185D; }
  #end span { font-weight: 800; font-size: 4.4cqw; color: #1E1B4B; padding: 0 8cqw; }
  #end small { font-weight: 700; font-size: 3.8cqw; color: #B45309; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #FFF6E9; color: #57534E; z-index: 50; font-family: 'Be Vietnam Pro', sans-serif; }
  #start button { font: 800 22px 'Nunito'; padding: 14px 34px; border-radius: 999px; border: 0; background: #DB2777; color: #FFF; cursor: pointer; }
  #start small { opacity: 0.8; font-size: 14px; max-width: 520px; text-align: center; line-height: 1.6; }
  #start label { font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .hide { display: none !important; }
  body.cursor-off { cursor: none; }
  .vg-paused *, .vg-paused *::after { animation-play-state: paused !important; }
  body.shot * { transition-delay: 0s !important; }
  body.shot .tap { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <div class="bg"><i></i><i></i><i></i><i></i>
    <b style="left:10%;top:30%;color:#F59E0B">+</b><b style="left:86%;top:19%;color:#DB2777;animation-delay:1.2s">×</b>
    <b style="left:7%;top:64%;color:#38BDF8;animation-delay:2s">÷</b><b style="left:89%;top:67%;color:#10B981;animation-delay:.6s">=</b>
  </div>
  <div id="segs"></div>
  <div id="cap"><p id="capText"></p></div>
  <div id="end"><img src="/icons/icon-512.png" alt=""><b id="endBig"></b><span id="endSmall"></span><small id="endNote"></small></div>
  <div id="mark"><img src="/icons/icon-192.png" alt=""><div><span>Toán Tiểu Học</span><small>Mầm non đến lớp 5</small></div></div>
</div></div>

<div id="start">
  <div style="font:900 40px 'Nunito';color:#BE185D">Giới thiệu Toán Tiểu Học</div>
  <button id="go">▶ Bắt đầu chiếu</button>
  <label><input type="checkbox" id="voiceOn" checked> Đọc lời (bỏ chọn nếu tự nói)</label>
  <label><input type="checkbox" id="musicOn" checked> Nhạc nền</label>
  <small id="voiceInfo">Đang tìm giọng đọc…</small>
  <small>F: toàn màn hình · Space: tạm dừng · R: chiếu lại · Khung dọc 9:16 (TikTok), khoảng 1 phút 20</small>
</div>

<script type="module" src="./play.js"></script>
</body>
</html>
